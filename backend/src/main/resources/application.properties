spring.application.name=backend

# O frontend consome a API em http://localhost:8080/api (ver frontend/.env.example)
server.servlet.context-path=/api

# Credenciais locais (nao versionadas): application-local.properties sobrescreve o que vem abaixo.
spring.config.import=optional:classpath:application-local.properties

# Banco de dados MySQL. Sobrescreva por variavel de ambiente em cada maquina:
# DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:selecao_rh}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# O schema e versionado pelo Flyway (backend/src/main/resources/db/migration);
# o Hibernate nao altera nem valida a estrutura.
# (troque para "validate" se quiser que o Hibernate confira o mapeamento no startup)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway: aplica as migrations em db/migration no startup.
# baseline-on-migrate permite rodar num banco ja existente (criado antes do Flyway,
# via database/schema.sql): ele marca o schema atual como V1 sem tentar recria-lo.
# Em um banco novo e vazio essa opcao nao tem efeito; a V1 roda normalmente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Segredo do JWT (HS256), com no minimo 32 caracteres. Sem valor padrao de proposito:
# sem a variavel JWT_SECRET a aplicacao nao sobe, e nenhum token e assinado com um segredo publico.
# Gere um com: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}

# Origens liberadas para CORS (servidor de desenvolvimento do Vite + producao)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Upload do PDF do curriculo: diretorio em disco, fora do repositorio.
# Na VPS aponte para um caminho gravavel e persistente (ex. /opt/app/uploads) via APP_UPLOAD_DIR.
app.upload.dir=${APP_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
