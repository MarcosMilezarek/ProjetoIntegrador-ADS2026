# Perfil de teste: banco em memoria, para os testes nao dependerem de um MySQL local.
spring.application.name=backend

spring.datasource.url=jdbc:h2:mem:selecao_rh;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# As migrations do Flyway sao MySQL-especificas (ENUM etc.); nos testes o Hibernate
# gera o schema direto no H2 a partir das entidades, entao o Flyway fica desligado.
spring.flyway.enabled=false
